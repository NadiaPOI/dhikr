["إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ","Inna shāniʾaka huwa l-abtar","Celui qui te hait est celui qui sera sans postérité."]]},
{id:"kursi",c:"s",t:"Āyat al-Kursī",n:1,s:"Coran 2:255 · Bukhārī 2311 : avant de dormir, un gardien d’Allah veille sur toi",v:[
["اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ","Allāhu lā ilāha illā huwa l-ḥayyu l-qayyūm, lā taʾkhudhuhu sinatun wa lā nawm, lahu mā fī s-samāwāti wa mā fī l-arḍ","Allah ! Pas de divinité à part Lui, le Vivant, Celui qui subsiste par Lui-même. Ni somnolence ni sommeil ne Le saisissent. À Lui appartient ce qui est dans les cieux et sur la terre."],
["مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ","Man dhā lladhī yashfaʿu ʿindahu illā bi-idhnih, yaʿlamu mā bayna aydīhim wa mā khalfahum, wa lā yuḥīṭūna bi-shayʾin min ʿilmihi illā bi-mā shāʾ","Qui peut intercéder auprès de Lui sans Sa permission ? Il connaît leur passé et leur avenir, et l’on n’embrasse de Sa science que ce qu’Il veut."],
["وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","Wasiʿa kursiyyuhu s-samāwāti wa l-arḍ, wa lā yaʾūduhu ḥifẓuhumā, wa huwa l-ʿaliyyu l-ʿaẓīm","Son Trône déborde les cieux et la terre, et leur garde ne Lui coûte aucune peine. Et Il est le Très Haut, l’Immense."]]},
{id:"duha",c:"s",t:"Ad-Ḍuḥā",n:1,v:[
["وَالضُّحَىٰ","Wa ḍ-ḍuḥā","Par le jour montant !"],
["وَاللَّيْلِ إِذَا سَجَىٰ","Wa l-layli idhā sajā","Par la nuit quand elle devient calme !"],
["مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","Mā waddaʿaka rabbuka wa mā qalā","Ton Seigneur ne t’a ni abandonné ni détesté."],
["وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ","Wa la-l-ākhiratu khayrun laka mina l-ūlā","La vie dernière est meilleure pour toi que la première."],
["وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","Wa la-sawfa yuʿṭīka rabbuka fa-tarḍā","Ton Seigneur te donnera bientôt de quoi te satisfaire."],
["أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ","Alam yajidka yatīman fa-āwā","Ne t’a-t-Il pas trouvé orphelin et accueilli ?"],
["وَوَجَدَكَ ضَالًّا فَهَدَىٰ","Wa wajadaka ḍāllan fa-hadā","Ne t’a-t-Il pas trouvé égaré et guidé ?"],
["وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ","Wa wajadaka ʿāʾilan fa-aghnā","Ne t’a-t-Il pas trouvé pauvre et enrichi ?"],
["فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ","Fa-ammā l-yatīma fa-lā taqhar","Quant à l’orphelin, ne le maltraite pas,"],
["وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ","Wa ammā s-sāʾila fa-lā tanhar","quant au demandeur, ne le repousse pas,"],
["وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ","Wa ammā bi-niʿmati rabbika fa-ḥaddith","et quant au bienfait de ton Seigneur, proclame-le."]]},
{id:"sharh",c:"s",t:"Ash-Sharḥ",n:1,v:[
["أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","Alam nashraḥ laka ṣadrak","Ne t’avons-Nous pas ouvert ta poitrine,"],
["وَوَضَعْنَا عَنكَ وِزْرَكَ","Wa waḍaʿnā ʿanka wizrak","et ôté de toi ton fardeau"],
["الَّذِي أَنقَضَ ظَهْرَكَ","Alladhī anqaḍa ẓahrak","qui accablait ton dos,"],
["وَرَفَعْنَا لَكَ ذِكْرَكَ","Wa rafaʿnā laka dhikrak","et élevé pour toi ta renommée ?"],
["فَإِنَّ مَعَ الْعُسْرِ يُسْرًا","Fa-inna maʿa l-ʿusri yusrā","Avec la difficulté vient certes la facilité."],
["إِنَّ مَعَ الْعُسْرِ يُسْرًا","Inna maʿa l-ʿusri yusrā","Avec la difficulté vient certes la facilité."],
["فَإِذَا فَرَغْتَ فَانصَبْ","Fa-idhā faraghta fa-nṣab","Quand tu as terminé, applique-toi,"],
["وَإِلَىٰ رَبِّكَ فَارْغَب","Wa ilā rabbika fa-rghab","et vers ton Seigneur oriente ton désir."]]},
{id:"asr",c:"s",t:"Al-ʿAṣr",n:1,v:[
["وَالْعَصْرِ","Wa l-ʿaṣr","Par le temps !"],
["إِنَّ الْإِنسَانَ لَفِي خُسْرٍ","Inna l-insāna la-fī khusr","L’homme est certes en perdition,"],
["إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ","Illā lladhīna āmanū wa ʿamilū ṣ-ṣāliḥāti wa tawāṣaw bi-l-ḥaqqi wa tawāṣaw bi-ṣ-ṣabr","sauf ceux qui croient, font de bonnes œuvres, s’enjoignent mutuellement la vérité et s’enjoignent mutuellement la patience."]]},
{id:"nasr",c:"s",t:"An-Naṣr",n:1,v:[
["إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","Idhā jāʾa naṣru llāhi wa l-fatḥ","Lorsque vient le secours d’Allah, ainsi que la victoire,"],
["وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","Wa raʾayta n-nāsa yadkhulūna fī dīni llāhi afwājā","et que tu vois les gens entrer en foule dans la religion d’Allah,"],
["فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ ۚ إِنَّهُ كَانَ تَوَّابًا","Fa-sabbiḥ bi-ḥamdi rabbika wa staghfirh, innahu kāna tawwābā","alors glorifie ton Seigneur par Sa louange et implore Son pardon, car Il accueille toujours le repentir."]]},
{id:"reveil",c:"d",t:"Au réveil",n:1,v:[["الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ","Al-ḥamdu lillāhi lladhī aḥyānā baʿda mā amātanā wa ilayhi n-nushūr","Louange à Allah qui nous a redonné la vie après nous avoir fait mourir, et c’est vers Lui la résurrection."]]},
{id:"avant",c:"d",t:"Avant de manger",n:1,v:[["بِسْمِ اللَّهِ","Bismillāh","Au nom d’Allah."]]},
{id:"apres",c:"d",t:"Après avoir mangé",n:1,v:[["الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَٰذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","Al-ḥamdu lillāhi lladhī aṭʿamanī hādhā wa razaqanīhi min ghayri ḥawlin minnī wa lā quwwa","Louange à Allah qui m’a nourri de ceci et me l’a accordé, sans force ni puissance de ma part."]]},
{id:"sortie",c:"d",t:"En sortant de la maison",n:1,v:[["بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","Bismillāhi tawakkaltu ʿala llāh, wa lā ḥawla wa lā quwwata illā billāh","Au nom d’Allah, je m’en remets à Allah ; il n’y a de force ni de puissance qu’en Allah."]]},
{id:"hasbi",c:"d",t:"Quand je suis préoccupée",n:3,s:"Coran 9:129",v:[["حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","Ḥasbiya llāhu lā ilāha illā huwa, ʿalayhi tawakkaltu wa huwa rabbu l-ʿarshi l-ʿaẓīm","Allah me suffit, il n’y a de dieu que Lui ; en Lui je place ma confiance, et Il est le Seigneur du Trône immense."]]},
{id:"hawla",c:"d",t:"Force et appui",n:10,s:"Bukhārī 4205 · Muslim 2704 : un trésor du Paradis",v:[["لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","Lā ḥawla wa lā quwwata illā billāh","Il n’y a de force ni de puissance qu’en Allah."]]},
{id:"ilm",c:"d",t:"Pour apprendre",n:1,v:[["رَبِّ زِدْنِي عِلْمًا","Rabbi zidnī ʿilmā","Seigneur, accrois mon savoir."]]},
{id:"dormir",c:"d",t:"Avant de dormir",n:1,s:"Bukhārī 6324",v:[["بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","Bismika llāhumma amūtu wa aḥyā","En Ton nom, ô Allah, je meurs et je vis."]]},
{id:"istighfar",c:"d",t:"Demander pardon",n:10,v:[["أَسْتَغْفِرُ اللَّهَ","Astaghfiru llāh","Je demande pardon à Allah."]]},
{id:"subhan",c:"d",t:"Gloire à Allah",n:10,v:[["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","Subḥāna llāhi wa bi-ḥamdih","Gloire et louange à Allah."]]},
{"id":"bika_matin","c":"a","t":"Par Toi nous entrons dans le matin","n":1,"s":"Abū Dāwūd 5068 · Tirmidhī 3391","v":[["اللّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُور","Allāhumma bika aṣbaḥnā wa bika amsaynā wa bika naḥyā wa bika namūtu wa ilayka n-nushūr","Ô Allah, c’est par Toi que nous sommes entrés dans le matin, par Toi que nous entrons dans le soir, par Toi que nous vivons, par Toi que nous mourons, et c’est vers Toi que sera la résurrection."]]},
{"id":"asbahna","c":"a","t":"Entrer dans le matin","n":1,"s":"Muslim 2723","v":[["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِير","Aṣbaḥnā wa aṣbaḥa l-mulku li-Llāh, wa l-ḥamdu li-Llāh, lā ilāha illa Llāhu waḥdahu lā sharīka lah, lahu l-mulku wa lahu l-ḥamdu wa Huwa ʿalā kulli shayʾin qadīr","Nous sommes entrés dans le matin, et la souveraineté appartient à Allah. Toute louange est à Allah. Il n’y a de divinité qu’Allah, Seul, sans associé — à Lui la souveraineté, à Lui la louange, et Il est Puissant sur toute chose."]]},
{"id":"sayyid","c":"a","t":"Sayyid al-Istighfār","n":1,"s":"Bukhārī 6306 — 1× le matin, le Prophète ﷺ dit : si l’on meurt ce jour, on entre au Paradis","v":[["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","Allāhumma Anta Rabbī lā ilāha illā Anta khalaqtanī wa anā ʿabduka wa anā ʿalā ʿahdika wa waʿdika ma staṭaʿtu aʿūdhu bika min sharri mā ṣanaʿtu abūʾu laka bi-niʿmatika ʿalayya wa abūʾu bi-dhanbī fa-ghfir lī fa-innahu lā yaghfiru dh-dhunūba illā Anta","Ô Allah, Tu es mon Seigneur, il n’y a de divinité que Toi. Tu m’as créé et je suis Ton serviteur. Je m’en tiens à mon engagement et à ma promesse envers Toi autant que je le peux. Je me réfugie auprès de Toi contre le mal de ce que j’ai commis. Je reconnais Tes bienfaits sur moi et je reconnais mes péchés — pardonne-moi, car nul ne pardonne les péchés sinon Toi."]]},
{"id":"khayr_yawm","c":"a","t":"Demander le bien de la journée","n":1,"s":"Abū Dāwūd 5084","v":[["اللّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ فَتْحَهُ وَنَصْرَهُ وَنُورَهُ وَبَرَكَتَهُ وَهُدَاهُ","Allāhumma innī asʾaluka khayra hādhā l-yawm fatḥahu wa naṣrahu wa nūrahu wa barakatahu wa hudāh","Ô Allah, je Te demande le bien de ce jour : son ouverture, son secours, sa lumière, sa bénédiction et sa guidance."]]},
{"id":"afini","c":"a","t":"Pour ma santé","n":3,"s":"Abū Dāwūd 5090 — 3×","v":[["اللَّهُمَّ عَافِنِي فِي بَدَنِي اللَّهُمَّ عَافِنِي فِي سَمْعِي اللَّهُمَّ عَافِنِي فِي بَصَرِي لَا إِلَهَ إِلَّا أَنتَ","Allāhumma ʿāfinī fī badanī, Allāhumma ʿāfinī fī samʿī, Allāhumma ʿāfinī fī baṣarī, lā ilāha illā Anta","Ô Allah, préserve-moi dans mon corps. Ô Allah, préserve-moi dans mon ouïe. Ô Allah, préserve-moi dans ma vue. Il n’y a de divinité que Toi."]]},
{"id":"ilm_nafi","c":"a","t":"Après le Fajr : une science utile","n":1,"s":"Ibn Mājah 925 · après le salām de la prière du Fajr","v":[["اللّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلًا مُتَقَبَّلًا","Allāhumma innī asʾaluka ʿilman nāfiʿan wa rizqan ṭayyiban wa ʿamalan mutaqabbalan","Ô Allah, je Te demande une science utile, une subsistance pure et une action agréée."]]},
{"id":"iqbal","c":"a","t":"Au coucher du soleil","n":1,"s":"Abū Dāwūd 530 · Tirmidhī 3589","v":[["اللّهُمَّ هَذَا إِقْبَالُ لَيْلِكَ وَإِدْبَارُ نَهَارِكَ وَأَصْوَاتُ دُعَاتِكَ فَاغْفِرْ لِي","Allāhumma hādhā iqbālu laylika wa idbāru nahārika wa aṣwātu duʿātika fa-ghfir lī","Ô Allah, voici la venue de Ta nuit, le départ de Ton jour et les voix de Tes appelants — pardonne-moi."]]},
{"id":"amsayna","c":"a","t":"Entrer dans le soir","n":1,"s":"Muslim 2723","v":[["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ","Amsaynā wa amsa l-mulku li-Llāh, wa l-ḥamdu li-Llāh, lā ilāha illa Llāhu waḥdahu lā sharīka lah","Nous sommes entrés dans le soir, et la souveraineté appartient à Allah. Toute louange est à Allah. Il n’y a de divinité qu’Allah, Seul, sans associé."]]},
{"id":"bika_soir","c":"a","t":"Par Toi nous entrons dans le soir","n":1,"s":"Abū Dāwūd 5068","v":[["اللّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِير","Allāhumma bika amsaynā wa bika aṣbaḥnā wa bika naḥyā wa bika namūtu wa ilayka l-maṣīr","Ô Allah, c’est par Toi que nous entrons dans le soir, par Toi que nous entrons dans le matin, par Toi que nous vivons, par Toi que nous mourons, et c’est à Toi que sera le retour."]]},
{"id":"aslamtu","c":"a","t":"Me confier à Allah avant de dormir","n":1,"s":"Bukhārī 247 — avant de s’endormir","v":[["اللَّهُمَّ إِلَيْكَ أَسْلَمْتُ نَفْسِي وَإِلَيْكَ وَجَّهْتُ وَجْهِي وَإِلَيْكَ فَوَّضْتُ أَمْرِي","Allāhumma ilayka aslamtu nafsī wa ilayka wajjahtu wajhī wa ilayka fawwaḍtu amrī","Ô Allah, je Te remets mon âme, je tourne mon visage vers Toi et je confie toute mon affaire à Toi."]]},
{"id":"salat","c":"d","t":"Pour persévérer dans la prière","n":1,"s":"Coran 14:40","v":[["رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاء","Rabbi jʾalnī muqīma ṣ-ṣalāti wa min dhurriyyatī Rabbanā wa taqabbal duʿāʾ","Seigneur, fais que j’accomplisse la prière ainsi que ma descendance. Notre Seigneur, accepte ma supplication."]]},
{"id":"istighfar_long","c":"d","t":"Demander pardon (version complète)","n":1,"s":"Abū Dāwūd 1517 · Tirmidhī 3577","v":[["أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ","Astaghfiru Llāha l-ʿAẓīm alladhī lā ilāha illā Huwa l-Ḥayyu l-Qayyūmu wa atūbu ilayh","Je demande pardon à Allah, le Très Grand, Lui en dehors de Qui il n’y a pas de divinité, le Vivant, Celui qui subsiste par Lui-même, et je me repens à Lui."]]},
{"id":"hamm","c":"t","t":"Contre l’angoisse et la tristesse","n":3,"s":"Bukhārī 6369","v":[["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ وَالْبُخْلِ وَالْجُبْنِ وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","Allāhumma innī aʿūdhu bika mina l-hammi wa l-ḥazani wa l-ʿajzi wa l-kasali wa l-bukhli wa l-jubni wa ḍalaʿi d-dayni wa ghalabati r-rijāl","Ô Allah, je me réfugie auprès de Toi contre l’anxiété et la tristesse, contre l’incapacité et la paresse, contre l’avarice et la lâcheté, contre le fardeau des dettes et la domination des hommes."]]},
{"id":"karb","c":"t","t":"Dans l’épreuve","n":1,"s":"Bukhārī 6346 · Muslim 2730 — récité par le Prophète ﷺ dans la détresse","v":[["لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيم","Lā ilāha illa Llāhu l-ʿAẓīmu l-Ḥalīm · lā ilāha illa Llāhu Rabbu l-ʿarshi l-ʿAẓīm · lā ilāha illa Llāhu Rabbu s-samāwāti wa Rabbu l-arḍi wa Rabbu l-ʿarshi l-Karīm","Il n’y a de divinité qu’Allah, le Grand, le Clément. Il n’y a de divinité qu’Allah, le Seigneur du Trône immense. Il n’y a de divinité qu’Allah, Seigneur des cieux, Seigneur de la terre, Seigneur du Trône noble."]]},
{"id":"yunus","c":"t","t":"L’invocation de Yūnus ﷺ","n":3,"s":"Coran 21:87 — Tirmidhī 3505 : quiconque la dit dans l’épreuve, Allah l’exaucera","v":[["لَا إِلَهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِين","Lā ilāha illā Anta subḥānaka innī kuntu mina ẓ-ẓālimīn","Il n’y a de divinité que Toi, gloire à Toi, j’ai été du nombre des injustes."]]},

{"id":"kafirun","c":"s","t":"Al-Kāfirūn","n":1,"s":"Coran 109 · Abū Dāwūd 5055 : avant de dormir","v":[["قُلْ يَا أَيُّهَا الْكَافِرُونَ","Qul yā ayyuha l-kāfirūn","Dis : « Ô vous qui ne croyez pas !"],["لَا أَعْبُدُ مَا تَعْبُدُونَ","Lā aʿbudu mā taʿbudūn","Je n’adore pas ce que vous adorez,"],["وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","Wa lā antum ʿābidūna mā aʿbud","et vous n’êtes pas adorateurs de ce que j’adore."],["وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ","Wa lā ana ʿābidun mā ʿabadtum","Je ne serai pas adorateur de ce que vous avez adoré,"],["وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","Wa lā antum ʿābidūna mā aʿbud","et vous ne serez pas adorateurs de ce que j’adore."],["لَكُمْ دِينُكُمْ وَلِيَ دِينِ","Lakum dīnukum wa liya dīn","À vous votre religion, à moi la mienne. »"]]},
{"id":"baqara","c":"s","t":"Al-Baqara 285-286","n":1,"s":"Coran 2:285-286 · Bukhārī 5009 · Muslim 807 : elles suffisent à qui les récite la nuit","v":[["آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ","Āmana r-rasūlu bimā unzila ilayhi min rabbihi wa l-muʾminūn","Le Messager a cru à ce qui lui a été révélé par son Seigneur, ainsi que les croyants."],["كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ","Kullun āmana billāhi wa malāʾikatihi wa kutubihi wa rusulih, lā nufarriqu bayna aḥadin min rusulih","Tous ont cru en Allah, à Ses anges, à Ses livres et à Ses messagers : « Nous ne faisons aucune différence entre Ses messagers. »"],["وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ","Wa qālū samiʿnā wa aṭaʿnā, ghufrānaka rabbanā wa ilayka l-maṣīr","Et ils ont dit : « Nous avons entendu et obéi. Pardon, notre Seigneur ! C’est vers Toi le devenir. »"],["لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ","Lā yukallifu llāhu nafsan illā wusʿahā, lahā mā kasabat wa ʿalayhā mā ktasabat","Allah n’impose à aucune âme une charge supérieure à sa capacité : elle aura ce qu’elle a acquis, et subira ce qu’elle a acquis."],["رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا","Rabbanā lā tuʾākhidhnā in nasīnā aw akhṭaʾnā","Notre Seigneur, ne nous châtie pas si nous oublions ou si nous faisons erreur."],["رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا","Rabbanā wa lā taḥmil ʿalaynā iṣran kamā ḥamaltahu ʿalā lladhīna min qablinā","Notre Seigneur, ne nous charge pas d’un fardeau comme celui dont Tu as chargé ceux d’avant nous."],["رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا","Rabbanā wa lā tuḥammilnā mā lā ṭāqata lanā bih, waʿfu ʿannā waghfir lanā warḥamnā","Notre Seigneur, ne nous impose pas ce que nous ne pouvons supporter. Efface nos fautes, pardonne-nous, fais-nous miséricorde."],["أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","Anta mawlānā fa-nṣurnā ʿalā l-qawmi l-kāfirīn","Tu es notre Maître : donne-nous la victoire sur les gens qui ne croient pas."]]}
